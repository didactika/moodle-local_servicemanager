name: Moodle Plugin CI

# Runs the moodle-plugin-ci checks (the same tests the Moodle.org plugins
# database runs) so regressions are caught automatically:
#   - on every push to `develop` (validate each commit during development), and
#   - on `main` plus pull requests into `develop`/`main` (validate before a release,
#     since release.yml publishes from `main`).
on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        # This plugin targets Moodle 4.5–5.2 (see version.php $plugin->supported).
        # We test the floor (4.5) and the current highest stable (5.2). Moodle 5.3
        # is not branched yet (still on `main`), so MOODLE_503_STABLE cannot be
        # tested until it is released — add it here on release day. Moodle 5.2
        # requires PHP 8.3+, so only PHP 8.3 is used for it; Moodle 4.5 runs on 8.1–8.3.
        php: ['8.1', '8.2', '8.3']
        moodle-branch: ['MOODLE_405_STABLE', 'MOODLE_502_STABLE']
        database: [pgsql, mariadb]
        exclude:
          - php: '8.1'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.2'
            moodle-branch: 'MOODLE_502_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        # NOTE: --scss-deprecations is intentionally omitted. The plugin still uses
        # Bootstrap 4 utility classes (mr-*, badge-*, text-right, ...) which Moodle 5.x
        # renders via its compat shim but flags as deprecated. They work on both 4.5
        # (native BS4) and 5.x (shim); re-enable this flag after migrating to BS5 classes.
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1

  ci-complete:
    # Single, stable status check to mark as "required" in branch protection on
    # `main`. The individual matrix job names (e.g. "test (8.3, MOODLE_405_STABLE,
    # pgsql)") change whenever the matrix changes, which makes them brittle to
    # require directly; this aggregator name never changes. It succeeds only when
    # every matrix combination in `test` succeeded.
    name: CI complete
    if: always()
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Verify all matrix jobs passed
        run: |
          result="${{ needs.test.result }}"
          echo "Test matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more CI matrix jobs did not succeed."
            exit 1
          fi
